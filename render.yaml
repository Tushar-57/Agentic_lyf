services:
  - type: web
    name: agentic-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.unified
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,https://*.netlify.app,http://localhost:3000,http://localhost:5173,http://localhost:8088
      - key: CORS_ALLOWED_ORIGIN_REGEX
        value: https://.*\\.vercel\\.app|https://.*\\.netlify\\.app
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_ENDPOINT
        sync: false
